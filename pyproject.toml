[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-local-demo"
version = "0.1.0"
description = "Local-first CS2 demo inspection MVP for WSL"
requires-python = ">=3.11,<3.14"
dependencies = [
  "demoparser2==0.42.0",
  "numpy==2.3.4",
  "pyarrow==21.0.0",
  "streamlit==1.51.0",
  "plotly==6.4.0",
  "pillow==12.3.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "polars==2.0.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]
browser = ["playwright==1.56.0"]

[project.scripts]
cs2ta = "cs2ta.cli:main"
cs2ta-api = "cs2ta.backend.api:main"
cs2ta-worker = "cs2ta.backend.worker:main"
cs2ta-task = "cs2ta.backend.tasks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cs2ta = ["frontend/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
